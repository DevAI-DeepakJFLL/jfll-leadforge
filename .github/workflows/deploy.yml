name: Deploy JFLL LeadForge to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-data:
    name: Deploy Analytical Parquet Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Required AWS Configuration (Secrets & Variables)
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
          AWS_SEC: ${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}
          DATA_BKT: ${{ secrets.S3_DATA_BUCKET || vars.S3_DATA_BUCKET }}
          FE_BKT: ${{ secrets.S3_FRONTEND_BUCKET || vars.S3_FRONTEND_BUCKET }}
          LMB_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME || vars.LAMBDA_FUNCTION_NAME }}
          CF_DIST: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          echo "=== Checking Configuration ==="
          missing=0
          
          check_var() {
            local name="$1"
            local val="$2"
            if [ -n "$val" ]; then
              echo "✅ Configured: $name"
            else
              echo "❌ MISSING: $name"
              missing=1
            fi
          }

          check_var "AWS_ACCESS_KEY_ID" "$AWS_KEY"
          check_var "AWS_SECRET_ACCESS_KEY" "$AWS_SEC"
          check_var "S3_DATA_BUCKET" "$DATA_BKT"
          check_var "S3_FRONTEND_BUCKET" "$FE_BKT"
          check_var "LAMBDA_FUNCTION_NAME" "$LMB_NAME"
          check_var "CLOUDFRONT_DISTRIBUTION_ID" "$CF_DIST"

          if [ $missing -eq 1 ]; then
            echo ""
            echo "::error::One or more required variables/secrets are missing."
            echo "👉 Go to: Repository Settings > Secrets and variables > Actions"
            echo "👉 Verify they are added under either 'Secrets' OR 'Variables' tab."
            exit 1
          fi
          echo "All required configurations found! Proceeding with deployment..."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ap-southeast-2' }}

      - name: Verify S3 Parquet Datasets
        run: |
          DATA_BKT="${{ secrets.S3_DATA_BUCKET || vars.S3_DATA_BUCKET }}"
          echo "Verifying analytical Parquet datasets in s3://${DATA_BKT}/leads/..."
          aws s3 ls "s3://${DATA_BKT}/leads/"

      - name: Verify Zero Excel/CSV Footprint in S3 Data Bucket
        run: |
          echo "Auditing S3 data bucket to ensure zero Excel (.xlsx) or CSV files exist..."
          DATA_BKT="${{ secrets.S3_DATA_BUCKET || vars.S3_DATA_BUCKET }}"
          EXCEL_COUNT=$(aws s3 ls "s3://${DATA_BKT}/" --recursive | grep -iE '\.(xlsx|csv)$' | wc -l || true)
          if [ "$EXCEL_COUNT" -gt 0 ]; then
            echo "::warning::Detected $EXCEL_COUNT Excel/CSV files in S3 data bucket. Purging to prevent storage costs..."
            aws s3 rm "s3://${DATA_BKT}/" --recursive --exclude "*" --include "*.xlsx" --include "*.csv"
          fi
          echo "✅ Verified: S3 data bucket contains only compressed .parquet analytical files."

  deploy-backend:
    name: Package & Deploy Backend Lambda
    needs: [ deploy-data ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ap-southeast-2' }}

      - name: Build Lambda Package
        run: |
          cd Backend
          mkdir -p package
          pip install --target ./package -r requirements-lambda.txt
          cp -r src ./package/
          cp lambda_function.py ./package/ 2>/dev/null || true
          cd package
          zip -r ../function.zip . -x "*__pycache__*" "*.pyc"
          cd ..
          echo "Lambda package size:"
          ls -lh function.zip

      - name: Upload & Update Lambda Function Code
        run: |
          cd Backend
          DATA_BUCKET="${{ secrets.S3_DATA_BUCKET || vars.S3_DATA_BUCKET }}"
          LAMBDA_NAME="${{ secrets.LAMBDA_FUNCTION_NAME || vars.LAMBDA_FUNCTION_NAME }}"
          
          # Upload zip to S3 first to avoid direct upload payload limits
          aws s3 cp function.zip "s3://${DATA_BUCKET}/lambda/function.zip"
          
          # Deploy code to AWS Lambda
          aws lambda update-function-code \
            --function-name "${LAMBDA_NAME}" \
            --s3-bucket "${DATA_BUCKET}" \
            --s3-key "lambda/function.zip"

      - name: Enforce CloudWatch Log Retention (14 Days)
        run: |
          LAMBDA_NAME="${{ secrets.LAMBDA_FUNCTION_NAME || vars.LAMBDA_FUNCTION_NAME }}"
          LOG_GROUP="/aws/lambda/${LAMBDA_NAME}"
          echo "Setting CloudWatch log retention for ${LOG_GROUP} to 14 days..."
          aws logs create-log-group --log-group-name "${LOG_GROUP}" 2>/dev/null || true
          aws logs put-retention-policy --log-group-name "${LOG_GROUP}" --retention-in-days 14 || echo "::warning::CloudWatch retention update skipped (check IAM logs permissions)"

  deploy-frontend:
    name: Build & Deploy Frontend to S3 and CloudFront
    needs: [ deploy-backend ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install & Build Frontend SPA
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
        run: |
          cd Frontend
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ap-southeast-2' }}

      - name: Verify Frontend Dist Zero Excel/CSV Footprint
        run: |
          if find ./Frontend/dist -type f \( -name "*.xlsx" -o -name "*.csv" \) | grep -q .; then
            echo "::error::Detected forbidden Excel (.xlsx) or CSV (.csv) files in frontend distribution!"
            exit 1
          fi
          echo "✅ Verified: Frontend build contains 0 Excel and 0 CSV files."

      - name: Sync Frontend Build to Private S3
        run: |
          FRONTEND_BUCKET="${{ secrets.S3_FRONTEND_BUCKET || vars.S3_FRONTEND_BUCKET }}"
          aws s3 sync ./Frontend/dist "s3://${FRONTEND_BUCKET}" --delete

      - name: Invalidate CloudFront Distribution Cache
        run: |
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          aws cloudfront create-invalidation \
            --distribution-id "${DIST_ID}" \
            --paths "/*"
